openapi: 3.0.3
info:
  title: SmartFood API
  version: 1.0.0
  description: 'API REST del sistema **SmartFood**, que permite a los estudiantes de la I.E. Normal Superior Montes
    de María confirmar con anticipación su asistencia al comedor escolar, y al administrador gestionar menús, usuarios,
    notificaciones y reportes.


    **Formato:** todas las peticiones y respuestas usan JSON (`Content-Type: application/json`).


    **Autenticación:** primero se llama a `POST /api/auth/login`; el token JWT recibido se envía en cada petición
    protegida con el encabezado `Authorization: Bearer <token>`. El token vence según `JWT_EXPIRES` (7 días por
    defecto).


    **Roles:** `estudiante` y `admin`. Cada servicio indica qué rol puede usarlo.


    **Errores:** las respuestas de error tienen la forma `{ "error": "mensaje" }`. Códigos usados: 400 (datos inválidos),
    401 (falta token), 403 (token inválido o rol sin permiso), 404 (no encontrado) y 500 (error del servidor).'
  contact:
    name: Julio Génes Beltrán
    url: https://github.com/JULIO-G77/SmartFood
servers:
- url: /
  description: Servidor actual (el mismo desde el que se abre esta documentación)
- url: https://smartfood-jau7.onrender.com
  description: Producción (Render)
- url: http://localhost:3000
  description: Desarrollo local
tags:
- name: Sistema
  description: Estado del servicio
- name: Autenticación
  description: Inicio de sesión y emisión del token JWT
- name: Menú
  description: Consulta y administración de menús diarios
- name: Confirmación
  description: Confirmación o cancelación de asistencia al comedor
- name: Usuarios
  description: Perfil propio y administración de usuarios
- name: Notificaciones
  description: Avisos individuales y masivos
- name: Reportes
  description: Estadísticas para el administrador
paths:
  /api/salud:
    get:
      tags:
      - Sistema
      summary: Estado del servicio
      description: Verifica que el servidor esté en línea. No requiere autenticación.
      x-rol: público
      responses:
        '200':
          description: Servicio activo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                  sistema:
                    type: string
                  version:
                    type: string
              example:
                estado: OK
                sistema: SmartFood
                version: 1.0.0
  /api/auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión
      description: 'Valida correo y contraseña y devuelve un token JWT que debe enviarse en el encabezado `Authorization:
        Bearer <token>` de los demás servicios. Solo inicia sesión con usuarios activos.'
      x-rol: público
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - correo
              - password
              properties:
                correo:
                  type: string
                  format: email
                password:
                  type: string
            example:
              correo: estudiante1@smartfood.co
              password: est123
      responses:
        '200':
          description: Inicio de sesión correcto.
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  usuario:
                    $ref: '#/components/schemas/UsuarioSesion'
              example:
                token: eyJhbGciOiJIUzI1NiIs...
                usuario:
                  id: 2
                  nombre: Sofía Martínez
                  correo: estudiante1@smartfood.co
                  rol: estudiante
                  perfil:
                    id_estudiante: 1
                    curso: 11°A
        '400':
          description: Datos de entrada inválidos (correo con mal formato o contraseña vacía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                - type: field
                  msg: Correo inválido
                  path: correo
                  location: body
        '401':
          description: Correo no registrado, usuario inactivo o contraseña incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Credenciales incorrectas
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
  /api/menu/hoy:
    get:
      tags:
      - Menú
      summary: Menú de hoy
      description: Devuelve el menú activo de la fecha actual (solo lectura).
      x-rol: estudiante o admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Menú de hoy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
              example:
                id_menu: 7
                fecha: '2026-10-13'
                entrada: Ensalada de aguacate
                plato_principal: Lentejas con arroz integral
                bebida: Jugo de mora
                postre: Fruta natural
                activo: 1
                creado_por: 1
        '404':
          description: No hay menú para hoy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No hay menú para hoy
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
  /api/menu:
    get:
      tags:
      - Menú
      summary: Menú de mañana
      description: Devuelve el menú activo del día siguiente, que es el que el estudiante confirma.
      x-rol: estudiante o admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Menú de mañana.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
              example:
                id_menu: 7
                fecha: '2026-10-13'
                entrada: Ensalada de aguacate
                plato_principal: Lentejas con arroz integral
                bebida: Jugo de mora
                postre: Fruta natural
                activo: 1
                creado_por: 1
        '404':
          description: No hay menú publicado para mañana.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No hay menú disponible para mañana
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
    post:
      tags:
      - Menú
      summary: Crear menú
      description: Crea el menú de un día futuro. La fecha debe ser mañana o posterior y no puede repetirse.
      x-rol: admin
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - fecha
              - entrada
              - plato_principal
              - bebida
              - postre
              properties:
                fecha:
                  type: string
                  format: date
                  description: 'Fecha del menú (AAAA-MM-DD). Mínimo: mañana.'
                entrada:
                  type: string
                  maxLength: 150
                plato_principal:
                  type: string
                  maxLength: 150
                bebida:
                  type: string
                  maxLength: 100
                postre:
                  type: string
                  maxLength: 100
            example:
              fecha: '2026-10-13'
              entrada: Ensalada de aguacate
              plato_principal: Lentejas con arroz integral
              bebida: Jugo de mora
              postre: Fruta natural
      responses:
        '201':
          description: Menú creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
              example:
                id_menu: 7
                fecha: '2026-10-13'
                entrada: Ensalada de aguacate
                plato_principal: Lentejas con arroz integral
                bebida: Jugo de mora
                postre: Fruta natural
                activo: 1
                creado_por: 1
        '400':
          description: Faltan campos, la fecha es de hoy o del pasado, o ya existe un menú para esa fecha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Ya existe un menú para esa fecha
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido/expirado, o el usuario no es administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Acceso restringido a administradores
  /api/menu/semana:
    get:
      tags:
      - Menú
      summary: Menú de la semana
      description: Lista los menús activos de lunes a viernes de la semana actual, ordenados por fecha.
      x-rol: estudiante o admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista de menús (puede estar vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Menu'
              example:
              - id_menu: 7
                fecha: '2026-10-13'
                entrada: Ensalada de aguacate
                plato_principal: Lentejas con arroz integral
                bebida: Jugo de mora
                postre: Fruta natural
                activo: 1
                creado_por: 1
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
  /api/menu/todos:
    get:
      tags:
      - Menú
      summary: Listar todos los menús
      description: Devuelve todos los menús registrados, del más reciente al más antiguo.
      x-rol: admin
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Lista completa de menús.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Menu'
              example:
              - id_menu: 7
                fecha: '2026-10-13'
                entrada: Ensalada de aguacate
                plato_principal: Lentejas con arroz integral
                bebida: Jugo de mora
                postre: Fruta natural
                activo: 1
                creado_por: 1
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido/expirado, o el usuario no es administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Acceso restringido a administradores
  /api/menu/{id}:
    put:
      tags:
      - Menú
      summary: Editar menú
      description: Actualiza los campos enviados de un menú existente.
      x-rol: admin
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del menú (id_menu).
        schema:
          type: integer
          minimum: 1
        example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                entrada:
                  type: string
                plato_principal:
                  type: string
                bebida:
                  type: string
                postre:
                  type: string
                activo:
                  type: integer
                  enum:
                  - 0
                  - 1
            example:
              plato_principal: Pollo al horno con arroz
      responses:
        '200':
          description: Menú actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Menu'
              example:
                id_menu: 7
                fecha: '2026-10-13'
                entrada: Ensalada de aguacate
                plato_principal: Lentejas con arroz integral
                bebida: Jugo de mora
                postre: Fruta natural
                activo: 1
                creado_por: 1
        '404':
          description: El menú no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Menú no encontrado
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido/expirado, o el usuario no es administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Acceso restringido a administradores
    delete:
      tags:
      - Menú
      summary: Eliminar menú
      description: Elimina un menú y sus confirmaciones asociadas.
      x-rol: admin
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador del menú (id_menu).
        schema:
          type: integer
          minimum: 1
        example: 1
      responses:
        '200':
          description: Menú eliminado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Menú eliminado
        '404':
          description: El menú no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Menú no encontrado
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido/expirado, o el usuario no es administrador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Acceso restringido a administradores
  /api/confirmacion:
    post:
      tags:
      - Confirmación
      summary: Confirmar asistencia
      description: Registra (o reactiva) la confirmación del estudiante autenticado para un menú y le genera una
        notificación. Solo funciona con un usuario que tenga perfil de estudiante.
      x-rol: estudiante
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id_menu
              properties:
                id_menu:
                  type: integer
                  minimum: 1
            example:
              id_menu: 7
      responses:
        '200':
          description: Asistencia confirmada.
          content:
            application/json:
              schema:
                type: object
                properties:
                  mensaje:
                    type: string
                  confirmacion:
                    $ref: '#/components/schemas/Confirmacion'
              example:
                mensaje: Asistencia confirmada
                confirmacion:
                  id_confirmacion: 12
                  id_estudiante: 1
                  id_menu: 7
                  estado: confirmado
                  fecha_confirmacion: '2026-10-12T18:20:00.000Z'
        '400':
          description: El usuario no es estudiante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Solo estudiantes pueden confirmar
        '404':
          description: El menú no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Menú no encontrado
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
  /api/confirmacion/{id_menu}:
    delete:
      tags:
      - Confirmación
      summary: Cancelar asistencia
      description: Cambia a "cancelado" la confirmación del estudiante autenticado y genera una notificación. Se
        puede volver a confirmar después.
      x-rol: estudiante
      security:
      - bearerAuth: []
      parameters:
      - name: id_menu
        in: path
        required: true
        description: Identificador del menú.
        schema:
          type: integer
          minimum: 1
        example: 1
      responses:
        '200':
          description: Asistencia cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mensaje'
              example:
                mensaje: Asistencia cancelada
        '404':
          description: El estudiante no había confirmado ese menú.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: No se encontró la confirmación
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
  /api/confirmacion/mi-estado/{id_menu}:
    get:
      tags:
      - Confirmación
      summary: Estado de mi confirmación
      description: Indica si el estudiante autenticado confirmó, canceló o no ha respondido para un menú.
      x-rol: estudiante
      security:
      - bearerAuth: []
      parameters:
      - name: id_menu
        in: path
        required: true
        description: Identificador del menú.
        schema:
          type: integer
          minimum: 1
        example: 1
      responses:
        '200':
          description: Estado actual.
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    enum:
                    - confirmado
                    - cancelado
                    - pendiente
                  confirmacion:
                    allOf:
                    - $ref: '#/components/schemas/Confirmacion'
                    nullable: true
              example:
                estado: confirmado
                confirmacion:
                  id_confirmacion: 12
                  id_estudiante: 1
                  id_menu: 7
                  estado: confirmado
                  fecha_confirmacion: '2026-10-12T18:20:00.000Z'
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
  /api/confirmacion/historial:
    get:
      tags:
      - Confirmación
      summary: Mi historial
      description: Últimas 30 confirmaciones del estudiante autenticado, de la más reciente a la más antigua, con
        datos del menú.
      x-rol: estudiante
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Historial.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - $ref: '#/components/schemas/Confirmacion'
                  - type: object
                    properties:
                      Menu:
                        $ref: '#/components/schemas/Menu'
              example:
              - id_confirmacion: 12
                id_estudiante: 1
                id_menu: 7
                estado: confirmado
                fecha_confirmacion: '2026-10-12T18:20:00.000Z'
                Menu:
                  fecha: '2026-10-13'
                  plato_principal: Lentejas con arroz integral
                  entrada: Ensalada de aguacate
                  bebida: Jugo de mora
        '500':
          description: Error interno del servidor o de la base de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: mensaje técnico del error
        '401':
          description: Falta el token (encabezado Authorization).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token requerido
        '403':
          description: Token inválido o expirado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Token inválido o expirado
  /api/confirmacion/conteo/{id_menu}:
    get:
      tags:
      - Confirmación
      summary: Conteo de confirmaciones de un menú
      description: Cuenta confirmados, cancelados y pendientes (total de estudiantes menos confirmados y cancelados).
        Alimenta la barra de progreso.
      x-rol: estudiante o admin
      security:
      - bearerAuth: []
      parameters:
      - name: id_menu
        in: path
        required: true
        description: Identificador del menú.
        schema:
          type: integer
          minimum: 1
        example: 1
      responses:
        '200':
          description: Conteo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmados:
                    type: integer
                  cancelados:
                    type: integer
                  pendientes:
                    type: integer
                  total:
                    type: integer
              example:
                confirmados: 87
                cancelados: 3
                pendientes: 10
                total: 100
        '500':
